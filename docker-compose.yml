x-php: &php
  image: helpdesk-whitelabel-php   # uma imagem para app, queue, scheduler e reverb
  build:
    context: ./docker/php
    args: { UID: "${UID:-1000}", GID: "${GID:-1000}" }
  volumes: [".:/var/www/html"]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  app:
    <<: *php
    ports: ["5174:5174"]   # Vite

  # Processa a fila (e-mails, broadcasts). Reinicia até o "composer install" existir no primeiro setup.
  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --backoff=30
    restart: unless-stopped

  # Agendador do Laravel (verificação de SLA).
  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  # Servidor WebSocket (Laravel Reverb).
  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["8080:8080"]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports: ["8001:80"]
    volumes:
      - ".:/var/www/html:ro"
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on: [app]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: secret
    ports: ["5434:5432"]
    volumes:
      - "dbdata:/var/lib/postgresql/data"
      - "./docker/postgres/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "helpdesk", "-d", "helpdesk"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit
    ports: ["8026:8025"]   # UI; SMTP em mailpit:1025

volumes:
  dbdata:
